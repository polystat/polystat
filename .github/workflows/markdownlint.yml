---
# yamllint disable rule:line-length
name: markdownlint
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  markdownlint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
